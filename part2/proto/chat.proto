syntax = "proto3";

package chat;

option go_package = "chat/chatpb";

service ChatRoom {
  // Unary: post one message to the room.
  rpc Send(ChatMessage) returns (SendReply);

  // Server streaming: receive every message posted after subscribing.
  rpc Subscribe(SubscribeRequest) returns (stream ChatMessage);
}

message ChatMessage {
  string user = 1;
  string text = 2;
  int64 seq = 3; 
}

message SendReply {
  int64 seq = 1;
}

message SubscribeRequest {
  string user = 1;
}